services:
  - type: web
    name: wa-clinic-receptionist
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ENABLE_REMINDERS
        value: "true"
      - key: REMINDER_CHECK_INTERVAL_MINUTES
        value: "15"
      - key: APP_ENV
        value: production
      - key: DASHBOARD_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VOICE_API_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLINIC_EMERGENCY_PHONE
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
